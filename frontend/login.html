<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Alumni Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-light: #F5F5F5;      /* Warna dasar */
      --accent-light: #A7E6FF;  /* Biru paling muda */
      --primary-soft: #3ABEF9;  /* Biru cerah */
      --primary-main: #3572EF;  /* Biru utama */
      --primary-dark: #050C9C;  /* Biru tua untuk aksen/tombol */
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-light);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 15px;
    }

    .login-container {
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(5, 12, 156, 0.1);
      max-width: 1000px;
      width: 100%;
      min-height: 600px;
    }

    /* Sisi Kiri: Visual dengan Gambar & Gradient */
    .login-visual {
      position: relative;
      background-color: var(--primary-dark);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 50px;
      color: white;
      overflow: hidden;
    }

    .login-visual-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('/uploads/gambarpagelogin.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.9; /* Opacity 50% sesuai permintaan */
      z-index: 1;
    }

    /* Gradient overlay agar teks lebih terbaca */
    .login-visual::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, transparent 0%, rgba(4, 8, 90, 0.8) 100%);
      z-index: 2;
    }

    .login-visual-content {
      position: relative;
      z-index: 3;
    }

    .login-visual h2 {
      font-weight: 700;
      font-size: 2.2rem;
      line-height: 1.3;
      color: white
    }

    /* Sisi Kanan: Form */
    .login-form-section {
      padding: 60px;
      background: white;
    }

    .brand-icon {
      color: var(--primary-main);
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .form-label {
      color: var(--primary-dark);
    }

    .form-control {
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--accent-light);
      background-color: #ffffff;
    }

    .form-control:focus {
      border-color: var(--primary-soft);
      box-shadow: 0 0 0 0.25rem rgba(58, 190, 249, 0.25);
    }

    .btn-primary {
      background-color: var(--primary-main);
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background-color: var(--primary-dark);
      transform: translateY(-2px);
    }

    .btn-outline-custom {
      border: 1px solid var(--accent-light);
      border-radius: 10px;
      color: var(--primary-dark);
      transition: 0.3s;
    }

    .btn-outline-custom:hover {
      background-color: var(--bg-light);
    }

    a {
      color: var(--primary-main);
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .login-visual { display: none !important; }
      .login-form-section { padding: 40px 25px; }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="row g-0 h-100">
      
      <div class="col-md-6 login-visual d-none d-md-flex">
        <div class="login-visual-bg"></div>
        <div class="login-visual-content">
          <p class="mb-2 text-white-50">Sistem Pelacakan Alumni</p>
          <h2>Kelola data lulusan dengan lebih efisien dan modern.</h2>
        </div>
      </div>

      <div class="col-md-6 login-form-section d-flex flex-column justify-content-center">
        <div class="brand-icon">*</div>
        <h3 class="fw-bold mb-1" style="color: var(--primary-dark);">Selamat Datang</h3>
        <p class="text-muted mb-4 small">Silakan masuk menggunakan akun terdaftar Anda.</p>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label small fw-bold">Username</label>
            <input type="text" id="username" class="form-control" placeholder="Nama Lengkap" required>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-bold">Kata Sandi</label>
            <input type="password" id="password" class="form-control" placeholder="Kata Sandi" required>
          </div>
          
          <button type="submit" class="btn btn-primary w-100 mb-3 shadow-sm">Masuk Sekarang</button>
          
          <div class="position-relative my-4 text-center">
            <hr>
            <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-muted">atau</span>
          </div>

          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-custom w-100 py-2 small">Google</button>
            <button type="button" class="btn btn-outline-custom w-100 py-2 small">Facebook</button>
          </div>

          <p class="mt-4 text-center small">
            Belum punya akun? <a href="register.html" class="text-decoration-none">Daftar sekarang</a>
          </p>
        </form>
      </div>

    </div>
  </div>

  <script>
    async function doLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
    
      try {
        const res  = await fetch('/api/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ username, password })
        });
        const data = await res.json();
      
        if (data.success) {
          // âœ… Simpan token JWT + info user
          if (data.token) {
            localStorage.setItem('token', data.token);
          } else {
            localStorage.removeItem('token');
          }
          localStorage.setItem('userId',     data.userId);
          localStorage.setItem('username',   data.username);
          localStorage.setItem('role',       data.role);
          localStorage.setItem('isLoggedIn', 'true');
        
          // Arahkan sesuai role
          if (data.role === 'admin') {
            window.location.replace('admin/index.html');
          } else {
            window.location.replace('user/user.html');
          }
        } else {
          alert(data.message || 'Login gagal');
        }
      } catch (err) {
        alert('Gagal terhubung ke server: ' + err.message);
      }
    }
  
    // Pasang event listener ke form login kamu
    // Ganti 'loginForm' dengan id form yang ada di HTML kamu
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.querySelector('form');
      if (form) form.addEventListener('submit', doLogin);
    });
  </script>
</body>
</html>
