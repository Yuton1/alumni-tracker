<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi Alumni - Alumni Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-light: #F5F5F5;      /* Warna dasar */
      --accent-light: #A7E6FF;  /* Biru paling muda */
      --primary-soft: #3ABEF9;  /* Biru cerah */
      --primary-main: #3572EF;  /* Biru utama */
      --primary-dark: #050C9C;  /* Biru tua untuk aksen/tombol */
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-light);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 15px;
    }

    .register-container {
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(5, 12, 156, 0.1);
      max-width: 1000px;
      width: 100%;
      min-height: 650px;
    }

    /* Sisi Kiri: Visual dengan Gambar Register & Gradient */
    .register-visual {
      position: relative;
      background-color: var(--primary-dark);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 50px;
      color: white;
      overflow: hidden;
    }

    .register-visual-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* Menggunakan path relatif agar sinkron di Railway */
      background-image: url('/uploads/gambarregister.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.9; /* Opacity 50% sesuai permintaan */
      z-index: 1;
    }

    /* Gradient overlay agar teks lebih terbaca */
    .register-visual::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, transparent 0%, rgba(10, 14, 93, 0.8) 100%);
      z-index: 2;
    }

    .register-visual-content {
      position: relative;
      z-index: 3;
    }

    .register-visual h2 {
      font-weight: 700;
      font-size: 2.2rem;
      line-height: 1.3;
      color: white;
    }

    /* Sisi Kanan: Form */
    .register-form-section {
      padding: 40px 60px;
      background: white;
    }

    .brand-icon {
      color: var(--primary-main);
      font-size: 2rem;
      margin-bottom: 5px;
    }

    .form-label {
      color: var(--primary-dark);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .form-control {
      border-radius: 10px;
      padding: 10px 14px;
      border: 1px solid var(--accent-light);
      background-color: #ffffff;
      font-size: 0.9rem;
    }

    .form-control:focus {
      border-color: var(--primary-soft);
      box-shadow: 0 0 0 0.25rem rgba(58, 190, 249, 0.15);
    }

    .btn-primary {
      background-color: var(--primary-main);
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-primary:hover {
      background-color: var(--primary-dark);
      transform: translateY(-2px);
    }

    .form-text.text-danger {
      font-size: 0.75rem;
    }

    @media (max-width: 768px) {
      .register-visual { display: none !important; }
      .register-form-section { padding: 30px 20px; }
    }
  </style>
</head>
<body>

  <div class="register-container">
    <div class="row g-0 h-100">
      
      <div class="col-md-6 register-visual d-none d-md-flex">
        <div class="register-visual-bg"></div>
        <div class="register-visual-content">
          <p class="mb-2 text-white-50">Bergabunglah dengan Kami</p>
          <h2>Daftarkan akun Anda dan tetap terhubung dengan jaringan alumni.</h2>
        </div>
      </div>

      <div class="col-md-6 register-form-section d-flex flex-column justify-content-center">
        <div class="brand-icon">*</div>
        <h3 class="fw-bold mb-1" style="color: var(--primary-dark);">Buat Akun</h3>
        <p class="text-muted mb-4 small">Lengkapi data di bawah ini untuk memulai registrasi.</p>

        <form id="registerForm">
          <div class="mb-2">
            <label class="form-label">Username (Nama Lengkap)</label>
            <input type="text" id="username" class="form-control" placeholder="Nama Lengkap" required>
          </div>

          <div class="mb-2">
            <label class="form-label">ID Master Alumni</label>
            <input type="number" id="alumniId" class="form-control" placeholder="Masukkan ID Administrasi" required>
            <div class="form-text text-danger">ID diperlukan untuk validasi data kelulusan.</div>
          </div>

          <div class="mb-2">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Password" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Konfirmasi Password</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Konfirmasi Password" required>
          </div>

          <button type="submit" class="btn btn-primary w-100 shadow-sm">Daftar Sekarang</button>
        </form>

        <p class="mt-4 text-center small">
          Sudah punya akun? <a href="login.html" class="text-decoration-none fw-bold" style="color: var(--primary-main);">Login di sini</a>
        </p>
      </div>

    </div>
  </div>

  <script>
    document.getElementById('registerForm').onsubmit = async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        alert('Konfirmasi password tidak cocok!');
        return;
      }

      const payload = {
        username: document.getElementById('username').value,
        password: password,
        alumni_id: document.getElementById('alumniId').value
      };

      try {
        const res = await fetch('/api/register', { 
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        
        if (data.success) {
          alert('Registrasi berhasil! Silakan login.');
          window.location.href = 'login.html';
        } else {
          alert('Gagal: ' + data.message);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Terjadi kesalahan koneksi ke server.');
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('token')) {
        window.location.href = 'user/user.html'; 
      }
    });
  </script>
</body>
</html>
