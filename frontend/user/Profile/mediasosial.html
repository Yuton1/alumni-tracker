<div class="section-head d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
  <div>
    <h5 class="fw-bold mb-1 text-dark" style="letter-spacing: -0.5px;">Media Sosial & Kontak</h5>
    <p class="text-muted mb-0 small">Perkuat jejaring alumni dengan menautkan profil profesional Anda.</p>
  </div>
</div>

<div class="p-4 rounded-4 shadow-sm" style="background-color: #f8fafc; border: 1px solid #edf2f7;">
  <form id="formMediaSosial" class="row g-4">
    
    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100" style="border-left: 4px solid #0077b5 !important;">
        <label class="form-label small text-muted fw-bold mb-2">
          <i class="fab fa-linkedin text-primary me-1"></i> LINKEDIN
        </label>
        <input type="url" id="linkedinUrl" class="form-control border-0 bg-light rounded-3 fw-medium" 
               placeholder="https://linkedin.com/in/username" style="padding: 10px 15px;">
      </div>
    </div>

    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100" style="border-left: 4px solid #e1306c !important;">
        <label class="form-label small text-muted fw-bold mb-2">
          <i class="fab fa-instagram text-danger me-1"></i> INSTAGRAM
        </label>
        <input type="url" id="instagramUrl" class="form-control border-0 bg-light rounded-3 fw-medium" 
               placeholder="https://instagram.com/username" style="padding: 10px 15px;">
      </div>
    </div>

    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100" style="border-left: 4px solid #1877f2 !important;">
        <label class="form-label small text-muted fw-bold mb-2">
          <i class="fab fa-facebook text-primary me-1"></i> FACEBOOK
        </label>
        <input type="url" id="facebookUrl" class="form-control border-0 bg-light rounded-3 fw-medium" 
               placeholder="https://facebook.com/username" style="padding: 10px 15px;">
      </div>
    </div>

    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100" style="border-left: 4px solid #000000 !important;">
        <label class="form-label small text-muted fw-bold mb-2">
          <i class="fab fa-tiktok text-dark me-1"></i> TIKTOK
        </label>
        <input type="url" id="tiktokUrl" class="form-control border-0 bg-light rounded-3 fw-medium" 
               placeholder="https://tiktok.com/@username" style="padding: 10px 15px;">
      </div>
    </div>

    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100">
        <label class="form-label small text-muted fw-bold mb-2">
          <i class="fas fa-envelope me-1 opacity-50"></i> EMAIL PUBLIK
        </label>
        <input type="email" id="emailPublikSosmed" class="form-control border-0 bg-light rounded-3 fw-medium text-primary" 
               placeholder="email@contoh.com" style="padding: 10px 15px;">
      </div>
    </div>

    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100">
        <label class="form-label small text-muted fw-bold mb-2">
          <i class="fab fa-whatsapp me-1 text-success"></i> WHATSAPP / NO HP
        </label>
        <input type="text" id="noHpSosmed" class="form-control border-0 bg-light rounded-3 fw-medium" 
               placeholder="08xxxxxxxxxx" style="padding: 10px 15px;">
      </div>
    </div>

    <div class="col-12 d-flex justify-content-end pt-2">
      <button type="submit" class="btn btn-primary rounded-3 px-4 py-2 shadow-sm border-0" 
              style="background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 100%); font-weight: 500;">
        <i class="fas fa-save me-2"></i> Simpan Media Sosial
      </button>
    </div>
  </form>
</div>
