<div class="section-head d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
  <div>
    <h5 class="fw-bold mb-1 text-dark" style="letter-spacing: -0.5px;">Informasi Akademik</h5>
    <p class="text-muted mb-0 small">Data sinkronisasi otomatis dari profil alumni resmi.</p>
  </div>
  <button class="btn btn-white btn-sm rounded-3 shadow-sm border px-3" id="btnRefreshAkademik" type="button" style="background: #fff; font-weight: 500;">
    <i class="fas fa-rotate text-primary me-1"></i> Refresh
  </button>
</div>

<div class="p-4 rounded-4" style="background-color: #f8fafc; border: 1px solid #edf2f7;">
  <div class="row g-3">
    
    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100">
        <label class="form-label small text-muted fw-medium mb-1" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Nama Lengkap</label>
        <div class="position-relative">
          <input class="form-control border-0 bg-light rounded-3 fw-semibold py-2 px-3" 
                 id="akademikNama" readonly value="Catur Rahmani Oktavia"
                 style="background-color: #f1f5f9 !important; color: #1e293b;">
          <i class="fas fa-copy position-absolute end-0 top-50 translate-middle-x text-muted opacity-50 small" style="cursor: pointer;"></i>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100">
        <label class="form-label small text-muted fw-medium mb-1" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Username</label>
        <div class="position-relative">
          <input class="form-control border-0 bg-light rounded-3 fw-semibold py-2 px-3" 
                 id="akademikUsername" readonly 
                 style="background-color: #f1f5f9 !important; color: #1e293b;">
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100">
        <label class="form-label small text-muted fw-medium mb-1" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Program Studi</label>
        <input class="form-control border-0 bg-light rounded-3 fw-semibold py-2 px-3" 
               id="akademikProdi" readonly 
               style="background-color: #f1f5f9 !important; color: #1e293b;">
      </div>
    </div>

    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100">
        <label class="form-label small text-muted fw-medium mb-1" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Fakultas</label>
        <input class="form-control border-0 bg-light rounded-3 fw-semibold py-2 px-3" 
               id="akademikFakultas" readonly 
               style="background-color: #f1f5f9 !important; color: #1e293b;">
      </div>
    </div>

    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100">
        <label class="form-label small text-muted fw-medium mb-1" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Tanggal Lulus</label>
        <input class="form-control border-0 bg-light rounded-3 fw-semibold py-2 px-3" 
               id="akademikTanggalLulus" readonly 
               style="background-color: #f1f5f9 !important; color: #1e293b;">
      </div>
    </div>

    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100">
        <label class="form-label small text-muted fw-medium mb-1" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Domisili</label>
        <input class="form-control border-0 bg-light rounded-3 fw-semibold py-2 px-3" 
               id="akademikDomisili" readonly 
               style="background-color: #f1f5f9 !important; color: #1e293b;">
      </div>
    </div>

    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100">
        <label class="form-label small text-muted fw-medium mb-1" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">Email Publik</label>
        <input class="form-control border-0 bg-light rounded-3 fw-semibold py-2 px-3" 
               id="akademikEmailPublik" readonly 
               style="background-color: #f1f5f9 !important; color: #0284c7;">
      </div>
    </div>

    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100">
        <label class="form-label small text-muted fw-medium mb-1" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">WhatsApp / No HP</label>
        <input class="form-control border-0 bg-light rounded-3 fw-semibold py-2 px-3" 
               id="akademikNoHp" readonly 
               style="background-color: #f1f5f9 !important; color: #1e293b;">
      </div>
    </div>

  </div>
</div>
