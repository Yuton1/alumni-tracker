<div class="section-head d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
  <div>
    <h5 class="fw-bold mb-1 text-dark" style="letter-spacing: -0.5px;">Form Data Pekerjaan</h5>
    <p class="text-muted mb-0 small">Kelola riwayat karir Anda secara profesional di sini.</p>
  </div>
</div>

<div class="p-4 rounded-4 mb-5" style="background-color: #f8fafc; border: 1px solid #edf2f7;">
  <form id="formPekerjaan" class="row g-4">
    <input type="hidden" id="pekerjaanId">

    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100">
        <label class="form-label small text-muted fw-bold mb-2">NAMA PERUSAHAAN</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-0"><i class="fas fa-building text-muted"></i></span>
          <input type="text" id="namaPerusahaan" class="form-control border-0 bg-light rounded-end-3 fw-medium" required placeholder="Nama instansi">
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100">
        <label class="form-label small text-muted fw-bold mb-2">POSISI / JABATAN</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-0"><i class="fas fa-briefcase text-muted"></i></span>
          <input type="text" id="posisi" class="form-control border-0 bg-light rounded-end-3 fw-medium" required placeholder="Contoh: Senior Manager">
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100">
        <label class="form-label small text-muted fw-bold mb-2">KATEGORI INSTANSI</label>
        <select id="jenisInstansi" class="form-select border-0 bg-light fw-medium py-2" required>
          <option value="Swasta">Swasta</option>
          <option value="PNS">PNS</option>
          <option value="Wirausaha">Wirausaha</option>
          <option value="BUMN">BUMN</option>
          <option value="Pendidikan">Pendidikan</option>
          <option value="Freelance">Freelance</option>
          <option value="Lainnya">Lainnya (isi manual)</option>
        </select>
      </div>
    </div>

    <div class="col-md-6 d-none" id="jenisInstansiLainnyaWrap">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100" style="border-left: 4px solid #0284c7 !important;">
        <label class="form-label small text-muted fw-bold mb-2">KATEGORI LAINNYA</label>
        <input type="text" id="jenisInstansiLainnya" class="form-control border-0 bg-light fw-medium" placeholder="Sebutkan kategori">
      </div>
    </div>

    <div class="col-md-12">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100">
        <label class="form-label small text-muted fw-bold mb-2">ALAMAT KERJA</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-0"><i class="fas fa-map-marked-alt text-muted"></i></span>
          <input type="text" id="alamatKerja" class="form-control border-0 bg-light rounded-end-3 fw-medium" placeholder="Alamat lengkap instansi">
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100">
        <label class="form-label small text-muted fw-bold mb-2">EMAIL PUBLIK</label>
        <input type="email" id="emailPublik" class="form-control border-0 bg-light fw-medium" placeholder="email@contoh.com">
      </div>
    </div>
    <div class="col-md-6">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 h-100">
        <label class="form-label small text-muted fw-bold mb-2">NO HP / WHATSAPP</label>
        <input type="text" id="noHp" class="form-control border-0 bg-light fw-medium" placeholder="08xxxxxxxxxx">
      </div>
    </div>

    <div class="col-12 d-flex gap-2 justify-content-end pt-3">
      <button type="button" class="btn btn-white border rounded-3 px-4 d-none" id="cancelEditPekerjaan" style="font-weight: 500;">Batal</button>
      <button type="submit" class="btn btn-primary rounded-3 px-4 shadow-sm" style="background: linear-gradient(120deg, #1e3a8a, #0284c7); border: none;">
        <i class="fas fa-save me-1"></i> <span id="submitPekerjaanLabel">Simpan Pekerjaan</span>
      </button>
    </div>
  </form>
</div>

<div class="section-head d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
  <div>
    <h5 class="fw-bold mb-1 text-dark">Rekap Pekerjaan</h5>
    <p class="text-muted mb-0 small">Daftar riwayat karir yang telah Anda tambahkan.</p>
  </div>
</div>

<div class="table-responsive rounded-4 shadow-sm bg-white p-2 border">
  <table class="table align-middle mb-0" style="border-collapse: separate; border-spacing: 0 10px;">
    <thead class="bg-light">
      <tr>
        <th class="border-0 px-4 py-3 text-muted small fw-bold" style="width: 60px; border-radius: 12px 0 0 12px;">NO</th>
        <th class="border-0 py-3 text-muted small fw-bold">PERUSAHAAN</th>
        <th class="border-0 py-3 text-muted small fw-bold">POSISI</th>
        <th class="border-0 py-3 text-muted small fw-bold">KATEGORI</th>
        <th class="border-0 py-3 text-muted small fw-bold text-center" style="width: 130px; border-radius: 0 12px 12px 0;">AKSI</th>
      </tr>
    </thead>
    <tbody id="rekapPekerjaanBody">
      <tr>
        <td colspan="5" class="text-center text-muted py-5 italic">
          <i class="fas fa-folder-open fa-2x d-block mb-2 opacity-25"></i>
          Memuat data riwayat pekerjaan...
        </td>
      </tr>
    </tbody>
  </table>
</div>
