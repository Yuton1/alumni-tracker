<div class="section-head d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
  <div>
    <h5 class="fw-bold mb-1 text-dark" style="letter-spacing: -0.5px;">Foto Profil</h5>
    <p class="text-muted mb-0 small">Perbarui foto profil Anda agar mudah dikenali oleh rekan alumni.</p>
  </div>
</div>

<div class="p-4 rounded-4" style="background-color: #f8fafc; border: 1px solid #edf2f7;">
  <div class="row g-4 align-items-center">
    
    <div class="col-md-4">
      <div class="p-3 bg-white rounded-4 shadow-sm border-0 text-center">
        <div class="position-relative d-inline-block w-100">
          <img id="previewFotoProfil" 
               src="https://ui-avatars.com/api/?name=Alumni&background=0284c7&color=fff" 
               alt="Preview Foto" 
               class="img-fluid rounded-4 shadow-sm" 
               style="max-height: 240px; width: 100%; object-fit: cover; border: 4px solid #f1f5f9;">
          
          <span class="position-absolute bottom-0 end-0 bg-success border border-white border-3 rounded-circle p-2 m-2" title="Online"></span>
        </div>
        <div class="mt-3">
          <span class="badge bg-light text-muted fw-medium rounded-pill px-3 py-2 border">Preview Saat Ini</span>
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <div class="p-4 bg-white rounded-4 shadow-sm border-0 h-100">
        <form id="formUpdateFoto">
          <div class="mb-4 text-center text-md-start">
            <h6 class="fw-bold text-dark mb-2">Pilih File Foto</h6>
            <p class="text-muted small">Gunakan foto formal/semi-formal. Format JPG, PNG, atau WEBP (Maks. 5MB).</p>
          </div>

          <div class="mb-4">
            <div class="p-4 rounded-4 border-2 border-dashed text-center position-relative transition-all" 
                 style="background-color: #f1f5f9; border-color: #cbd5e1; border-style: dashed !important;">
              <i class="fas fa-cloud-upload-alt fa-2x text-primary mb-2 opacity-50"></i>
              <label for="inputFoto" class="d-block small fw-bold text-muted mb-2" style="cursor: pointer;">
                Klik untuk mencari file atau seret foto ke sini
              </label>
              <input type="file" id="inputFoto" class="form-control border-0 position-absolute top-0 start-0 w-100 h-100 opacity-0" 
                     style="cursor: pointer;" accept="image/*" required>
              <div id="fileNameDisplay" class="small text-primary fw-semibold mt-2"></div>
            </div>
          </div>

          <div class="d-flex flex-column flex-md-row gap-2 justify-content-md-end">
            <button type="submit" class="btn btn-primary rounded-3 px-4 py-2 shadow-sm border-0" 
                    style="background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 100%); font-weight: 500;">
              <i class="fas fa-upload me-2"></i> Mulai Upload
            </button>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
