<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Alumni Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f6ff;
      --line: #d9e2f1;
      --blue: #2563eb;
      --cyan: #0284c7;
      --ink: #0f172a;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background:
        radial-gradient(circle at top right, rgba(37, 99, 235, 0.1), transparent 30%),
        radial-gradient(circle at bottom left, rgba(2, 132, 199, 0.1), transparent 35%),
        var(--bg);
      color: #1f2937;
      min-height: 100vh;
    }

    .topbar {
      background: linear-gradient(120deg, #1e3a8a, #0284c7);
      color: #fff;
      border-radius: 18px;
      box-shadow: 0 14px 34px rgba(30, 58, 138, 0.22);
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.07);
    }

    .stat-card {
      border: 0;
      border-radius: 14px;
      color: #fff;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.12);
    }

    .toolbar-btn.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .table thead th {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #64748b;
      border-bottom: 1px solid var(--line);
      background: #f8fbff;
    }

    .table tbody td {
      vertical-align: middle;
      border-color: #edf2fb;
      font-size: 0.9rem;
    }

    .row-clickable {
      cursor: pointer;
    }

    .row-clickable:hover {
      background: #f9fbff;
    }

    .status-pill {
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.6;
      display: inline-block;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <section class="topbar">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div>
          <h1 class="h4 mb-1 fw-semibold">Admin Pelacakan Alumni</h1>
          <p class="mb-0 small opacity-75">Monitoring status pelacakan, profil target, dan validasi hasil.</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-light btn-sm" id="refreshAllButton">
            <i class="fas fa-rotate me-1"></i> Refresh
          </button>
          <button class="btn btn-outline-light btn-sm" id="logoutButton">
            <i class="fas fa-right-from-bracket me-1"></i> Logout
          </button>
        </div>
      </div>
    </section>

    <section class="row g-3 mb-3">
      <div class="col-6 col-lg-3">
        <div class="card stat-card bg-success">
          <div class="card-body">
            <small class="opacity-75">Teridentifikasi</small>
            <h3 class="mb-0 fw-bold" id="statTeridentifikasi">0</h3>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card stat-card bg-warning text-dark">
          <div class="card-body">
            <small class="opacity-75">Perlu Verifikasi</small>
            <h3 class="mb-0 fw-bold" id="statVerifikasi">0</h3>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card stat-card bg-info">
          <div class="card-body">
            <small class="opacity-75">Belum Ditemukan</small>
            <h3 class="mb-0 fw-bold" id="statBelumDitemukan">0</h3>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card stat-card bg-secondary">
          <div class="card-body">
            <small class="opacity-75">Total Master Alumni</small>
            <h3 class="mb-0 fw-bold" id="statTotal">0</h3>
          </div>
        </div>
      </div>
    </section>

    <section class="panel p-3 p-lg-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div class="btn-group" role="group" aria-label="Tab data">
          <button type="button" class="btn btn-outline-primary toolbar-btn active" data-tab="antrean">
            <i class="fas fa-list-check me-1"></i> Antrean Pelacakan
          </button>
          <button type="button" class="btn btn-outline-primary toolbar-btn" data-tab="master">
            <i class="fas fa-database me-1"></i> Master Alumni
          </button>
        </div>
        <div class="d-flex gap-2">
          <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Cari nama, prodi, kota..." style="min-width: 230px;">
        </div>
      </div>

      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th style="width: 70px;">ID</th>
              <th>Nama</th>
              <th>Prodi</th>
              <th>Kota</th>
              <th>Tahun</th>
              <th>Status</th>
              <th style="width: 110px;" class="text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="dataBody">
            <tr>
              <td colspan="7" class="text-center text-muted py-4">Memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <div class="modal fade" id="profilingModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header text-white" style="background: linear-gradient(120deg, #1e3a8a, #0284c7);">
          <h5 class="modal-title">Detail Profil Target</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="profilingContent"></div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const state = {
      activeTab: 'antrean',
      antrean: [],
      master: []
    };

    function getToken() {
      const token = localStorage.getItem('token');
      if (!token || token === 'undefined' || token === 'null') return null;
      return token;
    }

    function showToast(message, type = 'primary') {
      const id = `toast-${Date.now()}`;
      const html = `
        <div id="${id}" class="toast text-bg-${type} border-0" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="d-flex">
            <div class="toast-body">${message}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>
        </div>`;

      document.getElementById('toastContainer').insertAdjacentHTML('beforeend', html);
      const el = document.getElementById(id);
      new bootstrap.Toast(el, { delay: 2800 }).show();
      el.addEventListener('hidden.bs.toast', () => el.remove());
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function logout() {
      ['token', 'userId', 'username', 'role', 'isLoggedIn'].forEach((key) => localStorage.removeItem(key));
      window.location.replace('../login.html');
    }

    async function authorizedFetch(url, options = {}) {
      const headers = new Headers(options.headers || {});
      const token = getToken();
      if (token) headers.set('Authorization', `Bearer ${token}`);

      const response = await fetch(url, { ...options, headers });
      if (response.status === 401) {
        showToast('Sesi berakhir. Silakan login ulang.', 'warning');
        setTimeout(logout, 800);
        throw new Error('Unauthorized');
      }

      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload.message || 'Gagal memuat data.');
      }
      return payload;
    }

    function requireAdminAccess() {
      const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
      const role = localStorage.getItem('role');
      if (!isLoggedIn || role !== 'admin') {
        window.location.replace('../login.html');
        return false;
      }
      return true;
    }

    async function updateStats() {
      const stats = await authorizedFetch('/api/stats');
      document.getElementById('statTeridentifikasi').textContent = stats['Teridentifikasi dari sumber publik'] || 0;
      document.getElementById('statVerifikasi').textContent = stats['Perlu Verifikasi Manual'] || 0;
      document.getElementById('statBelumDitemukan').textContent = stats['Belum ditemukan di sumber publik'] || 0;
      document.getElementById('statTotal').textContent = stats.totalAlumni || 0;
    }

    async function loadAntrean() {
      state.antrean = await authorizedFetch(`/api/antrean?t=${Date.now()}`);
    }

    async function loadMaster() {
      state.master = await authorizedFetch(`/api/master-alumni?t=${Date.now()}`);
    }

    function statusBadge(status) {
      if (!status) return '<span class="status-pill bg-secondary text-white"><span class="dot"></span>Belum Dilacak</span>';
      if (status.includes('Teridentifikasi')) return `<span class="status-pill bg-success text-white"><span class="dot"></span>${escapeHtml(status)}</span>`;
      if (status.includes('Verifikasi')) return `<span class="status-pill bg-warning text-dark"><span class="dot"></span>${escapeHtml(status)}</span>`;
      return `<span class="status-pill bg-info text-white"><span class="dot"></span>${escapeHtml(status)}</span>`;
    }

    function getActiveRows() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const rows = state.activeTab === 'antrean' ? state.antrean : state.master;

      if (!search) return rows;
      return rows.filter((item) => {
        const merged = `${item.nama || ''} ${item.prodi || ''} ${item.kota || ''}`.toLowerCase();
        return merged.includes(search);
      });
    }

    function renderTable() {
      const tbody = document.getElementById('dataBody');
      const rows = getActiveRows();

      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">Data tidak ditemukan.</td></tr>`;
        return;
      }

      tbody.innerHTML = rows.map((item) => {
        const canTrack = state.activeTab === 'antrean';
        const year = item.tahun_lulus || item.tanggal_lulus || '-';

        return `
          <tr class="row-clickable" data-detail-id="${item.id}">
            <td>#${escapeHtml(item.id)}</td>
            <td><strong>${escapeHtml(item.nama || '-')}</strong></td>
            <td>${escapeHtml(item.prodi || '-')}</td>
            <td>${escapeHtml(item.kota || '-')}</td>
            <td>${escapeHtml(year)}</td>
            <td>${statusBadge(item.status_pelacakan)}</td>
            <td class="text-center">
              ${canTrack
                ? `<button class="btn btn-sm btn-primary" data-track-id="${item.id}"><i class="fas fa-magnifying-glass me-1"></i>Track</button>`
                : '<span class="text-muted small">-</span>'}
            </td>
          </tr>`;
      }).join('');
    }

    function openProfilingModal(id) {
      const source = state.activeTab === 'antrean' ? state.antrean : state.master;
      const target = source.find((item) => Number(item.id) === Number(id));
      if (!target) return;

      const variasi = Array.isArray(target.nama_variasi) ? target.nama_variasi : [];
      const afiliasi = Array.isArray(target.kata_kunci_afiliasi) ? target.kata_kunci_afiliasi : [];
      const konteks = Array.isArray(target.kata_kunci_konteks) ? target.kata_kunci_konteks : [];

      document.getElementById('profilingContent').innerHTML = `
        <div class="mb-3">
          <h6 class="fw-bold mb-1">${escapeHtml(target.nama || '-')}</h6>
          <p class="text-muted mb-0 small">ID #${escapeHtml(target.id)} · ${escapeHtml(target.prodi || '-')}</p>
        </div>
        <div class="mb-3">
          <label class="small fw-semibold text-muted">Variasi Nama</label>
          <ul class="list-group mt-1">
            ${variasi.length ? variasi.map((x) => `<li class="list-group-item small">${escapeHtml(x)}</li>`).join('') : '<li class="list-group-item small text-muted">Belum tersedia</li>'}
          </ul>
        </div>
        <div class="mb-3">
          <label class="small fw-semibold text-muted">Kata Kunci Afiliasi</label>
          <div class="mt-1 d-flex flex-wrap gap-1">
            ${afiliasi.length ? afiliasi.map((x) => `<span class="badge text-bg-info">${escapeHtml(x)}</span>`).join('') : '<span class="text-muted small">Belum tersedia</span>'}
          </div>
        </div>
        <div>
          <label class="small fw-semibold text-muted">Kata Kunci Konteks</label>
          <div class="mt-1 d-flex flex-wrap gap-1">
            ${konteks.length ? konteks.map((x) => `<span class="badge text-bg-secondary">${escapeHtml(x)}</span>`).join('') : '<span class="text-muted small">Belum tersedia</span>'}
          </div>
        </div>`;

      new bootstrap.Modal(document.getElementById('profilingModal')).show();
    }

    async function trackAlumni(id) {
      try {
        const result = await authorizedFetch(`/api/track/${id}`, { method: 'POST' });
        showToast(`Tracking selesai. Status: ${result.status}`, 'success');
        await refreshAll();
      } catch (error) {
        showToast(error.message, 'danger');
      }
    }

    function setActiveTab(tabName) {
      state.activeTab = tabName;
      document.querySelectorAll('.toolbar-btn').forEach((button) => {
        button.classList.toggle('active', button.dataset.tab === tabName);
      });
      renderTable();
    }

    async function refreshAll() {
      try {
        await Promise.all([updateStats(), loadAntrean(), loadMaster()]);
        renderTable();
      } catch (error) {
        showToast(error.message, 'danger');
      }
    }

    function bindEvents() {
      document.getElementById('logoutButton').addEventListener('click', logout);
      document.getElementById('refreshAllButton').addEventListener('click', refreshAll);
      document.getElementById('searchInput').addEventListener('input', renderTable);

      document.querySelectorAll('.toolbar-btn').forEach((button) => {
        button.addEventListener('click', () => setActiveTab(button.dataset.tab));
      });

      document.getElementById('dataBody').addEventListener('click', (event) => {
        const trackBtn = event.target.closest('[data-track-id]');
        if (trackBtn) {
          event.stopPropagation();
          trackAlumni(trackBtn.dataset.trackId);
          return;
        }

        const row = event.target.closest('[data-detail-id]');
        if (row) {
          const idAlumni = row.dataset.detailId;
          window.location.href = `detailprofile.html?id=${idAlumni}`;
        }
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireAdminAccess()) return;
      bindEvents();
      await refreshAll();
    });
  </script>
</body>
</html>
